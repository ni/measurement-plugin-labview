name: Run VI Analyzer

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  run_vi_analyzer:
    name: Run VI Analyzer
    runs-on: 
      - self-hosted
      - windows
      - x64
      - rdss-measlinkbot-win-10-lv64
    timeout-minutes: 30
    steps:
    - name: Enable git long paths
      run: git config  --global core.longpaths true

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15'

    - name: Open LabVIEW 2023
      run: |
        Start-Process "C:\\Program Files\\National Instruments\\LabVIEW 2023\\LabVIEW.exe"
        Start-Sleep 60

    - name: Run VI Analyzer
      run:
        python "$env:RUNNER_WORKSPACE/measurement-plugin-labview/Source/Tools/run_vi_analyzer.py"
      timeout-minutes: 20

    - name: Close LabVIEW 2023
      run: Stop-Process -Name LabVIEW -Force -ErrorAction SilentlyContinue
      if: always()