name: Run G Tests

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  run_g_tests:
    name: Run G Tests LV${{ matrix.version }}
    runs-on: 
      - self-hosted
      - windows
      - x64
      - rdss-measlinkbot-win-10-lv64
    strategy:
      matrix:
        version: ["2021", "2022", "2023"]
        include: 
          - version: 2021
            port: "3364"
          - version: 2022
            port: "3365"
          - version: 2023
            port: "3366"
    timeout-minutes: 30
    steps:
    - name: Enable git long paths
      run: git config  --global core.longpaths true

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15'

    - name: Open LabVIEW ${{ matrix.version }}
      env:
        LV_VERSION: ${{ matrix.version }}
      run: |
        Start-Process "C:\Program Files\National Instruments\LabVIEW $env:LV_VERSION\LabVIEW.exe"
        Start-Sleep 60

    - name: Run G Tests
      env:
        LV_VERSION: ${{ matrix.version }}
        LV_PORT: ${{ matrix.port }}
      run:
        python "$env:RUNNER_WORKSPACE/measurement-plugin-labview/Source/Tests/run_tests.py" --labview-path "C:\Program Files\National Instruments\LabVIEW $env:LV_VERSION\LabVIEW.exe" --port-number "$env:LV_PORT"
      timeout-minutes: 20

    - name: Close LabVIEW ${{ matrix.version }}
      run: Stop-Process -Name LabVIEW -Force -ErrorAction SilentlyContinue
      if: always()